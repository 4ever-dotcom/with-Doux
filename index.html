<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Doux</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{
      --hg:#fefefe;--hg2:#efefec;--hg3:#e8e3d0;
      --ca:#d3#fefebe;--card-hover:#efe3d0;
      --tx:#2c2a24;--tx2:#605d58;--text3:#9a9a8e;
      --or-dark:#f35f3a;
      --ac:#c05aa7;--accent-hover:#b65aa2;--accent-soft:#d497e;
      --border:#d5d0ca;--border-light:#e0dcca;
      --radius:16px;--radius-sm:10px;--radius-xs:5px;
      --font-s:'Playfair Display',Georgia,serif;
      --font-inter:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      --safe-b:env(safe-area-inset-bottom,0px);
      --safe-t:env(safe-area-inset-top,0px);
    }
    html,body{height:100%;width:100%;font-family:var(--font-i);background:var(--bg);color:var(--text);overflow:hidden;font-size:16px}
    input,textarea,select{font-family:inherit}
    body{display:flex;flex-direction:column;position:relative;overflow:hidden}
    *{margin:0;padding:0;box-sizing:border-box}
    .app{height:100%;width:100%;display:flex;position:relative;overflow:hidden}
    .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
    .sidebar-overlay.active{opacity:1;pointer-events:auto}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--card);z-index:101;transform:translateX(-100%);transition:transform .3s}
    .sidebar.active{transform:translateX(0)}
    .sidebar-top{padding:52px 20px 16px;flex:0 0 auto}
    .sidebar-nav{flex:1;overflow-y:auto;padding:0 8px}
    .sb-item{padding:14px 16px;font-size:16px;color:var(--text);background:none;border:none;width:100%;text-align:left;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;gap:12px;font-weight:500;transition:background .2s}
    .sb-item:hover{background:var(--card-hover)}
    .sb-item.active{background:var(--accent-soft);color:var(--accent)}
    .sb-bottom{padding:12px 20px 16px;border-top:1px solid var(--border)}
    .sb-user{width:40px;height:40px;border-radius:50%;background:var(--card);object-fit:cover}
    .hdr{width:100%;height:36px;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;padding-top:max(10px,var(--safe-t));background:var(--bg);border:none;z-index:10}
    .hdr-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:none;background:none;border-radius:var(--radius);cursor:pointer;transition:background .2s}
    .hdr-btn:hover{background:var(--card)}
    .hdr-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .hdr-title{font-family:var(--font-s);font-size:18px;font-weight:600;letter-spacing:-.5px}
  
  /* PAGES */
  .page{display:none;flex-direction:column;height:100%;width:100%;min-width:0;padding:0}
  .page.active{display:flex}
  .page-wrapper{overflow:auto;-webkit-overflow-scrolling:touch}
  
  /* CHAT */
  .chat-area{flex:1;overflow-y:auto;padding:6px 16px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
  .chat-area.loading{overflow:hidden}
  .chat-msg{margin-bottom:16px;display:flex;gap:12px}
  .chat-msg.user{flex-direction:row-reverse}
  .chat-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--card);cursor:pointer}
  .chat-avatar svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none}
  .chat-bubble{padding:12px 16px;border-radius:16px;max-width:75%;word-wrap:break-word}
  .chat-msg.user .chat-bubble{background:var(--or-dark);color:#fff}
  .chat-msg:not(.user) .chat-bubble{background:var(--card)}
  .chat-msg code{background:rgba(0,0,0,.08);padding:2px 6px;border-radius:4px;font-size:14px}
  .chat-msg pre{background:rgba(0,0,0,.06);padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0}
  .chat-msg pre code{background:none;padding:0}
  .typing-cursor{display:inline-block;width:2px;height:1em;background:currentColor;margin-left:2px;animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .chat-bottom{padding:12px 20px;border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:10px;padding-bottom:max(12px,var(--safe-b))}
  .chat-input{flex:1;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);font-size:16px;resize:none;max-height:100px;font-family:inherit}
  .chat-send{width:44px;height:44px;border-radius:50%;background:var(--accent);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s}
  .chat-send:hover{background:var(--accent-hover)}
  .chat-send svg{width:20px;height:20px;stroke:#fff;stroke-width:2;fill:none}
  .avatar-picker{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
  .avatar-picker.show{display:flex}
  .avatar-panel{background:var(--card);border-radius:var(--radius);padding:24px;max-width:400px;width:100%}
  .avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
  .avatar-option{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;cursor:pointer;border:2px solid transparent;transition:border .2s}
  .avatar-option:hover{border-color:var(--accent)}
  .sb-sep{font-size:11px;text-transform:uppercase;color:var(--text2);padding:16px 12px 8px;font-weight:600;letter-spacing:.8px}
  .hdr-subtitle{font-size:12px;color:var(--text2)}
  .user-name{font-size:14px;font-weight:600;margin-bottom:4px}
  .user-sub{font-size:12px;color:var(--text2)}
  </style>
  
  <!-- MCP 接入 -->
  <link rel="stylesheet" href="src/styles/mcp.css">
  <script type="module" src="src/mcp/MCPClient.js"></script>
  <script type="module" src="src/mcp/MCPManager.js"></script>
  <script type="module" src="src/mcp/MCPPage.js"></script>
  
</head>
<body>
  
  <!-- APP (锁屏已移除) -->
  <div class="app">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="user-name">琦琦 & Doux</div>
        <div class="user-sub">在一起 92 天</div>
      </div>
      <div class="sidebar-nav">
        <div class="sb-sep">主要</div>
        <button class="sb-item active" data-page="chat">💬 聊天</button>
        <button class="sb-item" data-page="todo">✅ 待办</button>
        <button class="sb-item" data-page="calendar">📅 日历</button>
        <button class="sb-item" data-page="diary">📔 日记</button>
        <div class="sb-sep">共享</div>
        <button class="sb-item" data-page="moments">🌟 朋友圈</button>
        <button class="sb-item" data-page="reading">📚 共读</button>
        <button class="sb-item" data-page="daily">📰 日报</button>
        <div class="sb-sep">数据</div>
        <button class="sb-item" data-page="health">💪 健康</button>
        <button class="sb-item" data-page="status">📊 状态</button>
        <div class="sb-sep">系统</div>
        <button class="sb-item" data-page="workflow">⚙️ 工作流</button>
        <button class="sb-item" data-page="repo">📦 仓库</button>
        <button class="sb-item" data-page="mcp">🔌 MCP</button>
      </div>
      <div class="sb-bottom">
        <img class="sb-user" id="sidebarAvatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Doux" alt="Avatar">
      </div>
    </div>
    
    <div style="flex:1;display:flex;flex-direction:column;min-width:0">
      <div class="hdr">
        <button class="hdr-btn" id="menuBtn">
          <svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="hdr-title" id="pageTitle">聊天</div>
        <button class="hdr-btn" id="settingsBtn">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m-8-7h6m6 0h6"/></svg>
        </button>
      </div>
      
      <div id="pageContainer" style="flex:1;overflow:hidden;position:relative">
        <!-- Chat Page -->
        <div class="page active" id="page-chat">
          <div class="chat-area" id="chatArea"></div>
          <div class="chat-bottom">
            <textarea class="chat-input" id="chatInput" placeholder="输入消息..." rows="1"></textarea>
            <button class="chat-send" id="chatSend">
              <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
          </div>
        </div>
        
        <!-- Other Pages Placeholder -->
        <div class="page" id="page-todo"><div style="padding:20px">待办功能开发中...</div></div>
        <div class="page" id="page-calendar"><div style="padding:20px">日历功能开发中...</div></div>
        <div class="page" id="page-diary"><div style="padding:20px">日记功能开发中...</div></div>
        <div class="page" id="page-moments"><div style="padding:20px">朋友圈功能开发中...</div></div>
        <div class="page" id="page-reading"><div style="padding:20px">共读功能开发中...</div></div>
        <div class="page" id="page-daily"><div style="padding:20px">日报功能开发中...</div></div>
        <div class="page" id="page-health"><div style="padding:20px">健康功能开发中...</div></div>
        <div class="page" id="page-status"><div style="padding:20px">状态功能开发中...</div></div>
        <div class="page" id="page-workflow"><div style="padding:20px">工作流功能开发中...</div></div>
        <div class="page" id="page-repo"><div style="padding:20px">仓库功能开发中...</div></div>
        <div class="page" id="page-mcp" data-mcp-page></div>
      </div>
    </div>
  </div>
  
  <!-- Avatar Picker -->
  <div class="avatar-picker" id="avatarPicker">
    <div class="avatar-panel">
      <h3 style="margin-bottom:4px" id="avatarPickerTitle">选择头像</h3>
      <div class="hdr-subtitle">点击选择新头像</div>
      <div class="avatar-grid" id="avatarGrid"></div>
    </div>
  </div>
  
  <script type="module">
    import { renderMCPPage } from './src/mcp/MCPPage.js';
    
    // Sidebar
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const menuBtn = document.getElementById('menuBtn');
    
    menuBtn.addEventListener('click', () => {
      sidebar.classList.add('active');
      sidebarOverlay.classList.add('active');
    });
    
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('active');
      sidebarOverlay.classList.remove('active');
    });
    
    // Page Navigation
    const sbItems = document.querySelectorAll('.sb-item');
    const pages = document.querySelectorAll('.page');
    const pageTitle = document.getElementById('pageTitle');
    
    sbItems.forEach(btn => {
      btn.addEventListener('click', () => {
        const pageName = btn.dataset.page;
        sbItems.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        pages.forEach(p => p.classList.remove('active'));
        const targetPage = document.getElementById(`page-${pageName}`);
        targetPage.classList.add('active');
        pageTitle.textContent = btn.textContent.trim().slice(2);
        sidebar.classList.remove('active');
        sidebarOverlay.classList.remove('active');
        
        // Render MCP page if navigating to it
        if (pageName === 'mcp') {
          renderMCPPage();
        }
      });
    });
    
    // Chat
    const chatArea = document.getElementById('chatArea');
    const chatInput = document.getElementById('chatInput');
    const chatSend = document.getElementById('chatSend');
    
    let userAvatar = localStorage.getItem('userAvatar') || 'https://api.dicebear.com/7.x/avataaars/svg?seed=Kylie';
    let aiAvatar = localStorage.getItem('aiAvatar') || 'https://api.dicebear.com/7.x/avataaars/svg?seed=Doux';
    
    function addMessage(role, content) {
      const msg = document.createElement('div');
      msg.className = `chat-msg ${role}`;
      const avatar = document.createElement('img');
      avatar.className = 'chat-avatar';
      avatar.src = role === 'user' ? userAvatar : aiAvatar;
      avatar.dataset.role = role;
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble';
      bubble.innerHTML = content;
      msg.appendChild(avatar);
      msg.appendChild(bubble);
      chatArea.appendChild(msg);
      chatArea.scrollTop = chatArea.scrollHeight;
      return bubble;
    }
    
    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      addMessage('user', text);
      chatInput.value = '';
      const aiBubble = addMessage('assistant', '<span class="typing-cursor"></span>');
      setTimeout(() => {
        aiBubble.innerHTML = '收到！MCP 功能已接入，现在可以在 MCP 页面配置服务器了～';
      }, 800);
    }
    
    chatSend.addEventListener('click', sendMessage);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    
    // Avatar Picker
    const avatarPicker = document.getElementById('avatarPicker');
    const avatarGrid = document.getElementById('avatarGrid');
    const avatarPickerTitle = document.getElementById('avatarPickerTitle');
    let pickingFor = null;
    
    const seeds = ['Doux','Kylie','Luna','Max','Alex','Sam','Riley','Jordan'];
    seeds.forEach(seed => {
      const img = document.createElement('img');
      img.className = 'avatar-option';
      img.src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${seed}`;
      img.addEventListener('click', () => {
        if (pickingFor === 'user') {
          userAvatar = img.src;
          localStorage.setItem('userAvatar', userAvatar);
        } else {
          aiAvatar = img.src;
          localStorage.setItem('aiAvatar', aiAvatar);
        }
        document.querySelectorAll(`.chat-avatar[data-role="${pickingFor}"]`).forEach(av => av.src = img.src);
        document.getElementById('sidebarAvatar').src = aiAvatar;
        avatarPicker.classList.remove('show');
      });
      avatarGrid.appendChild(img);
    });
    
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('chat-avatar')) {
        pickingFor = e.target.dataset.role;
        avatarPickerTitle.textContent = pickingFor === 'user' ? '选择你的头像' : '选择 Doux 的头像';
        avatarPicker.classList.add('show');
      }
    });
    
    avatarPicker.addEventListener('click', (e) => {
      if (e.target === avatarPicker) avatarPicker.classList.remove('show');
    });
    
    document.getElementById('sidebarAvatar').src = aiAvatar;
  </script>
</body>
</html>
